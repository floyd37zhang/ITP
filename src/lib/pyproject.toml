[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lib"
version = "0.1.0"
description = "Reusable MySQL client with sync/async unified API"
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]